name: rapidhelp_roadside
description: "RapidHelp - 24/7 Roadside Assistance & Emergency Response App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  permission_handler: ^11.3.0
  camera: ^0.10.5
  geolocator: ^9.0.2
  google_maps_flutter: ^2.5.0
  supabase_flutter: ^2.3.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true